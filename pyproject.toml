[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kubesentinel"
version = "0.1.0"
description = "Kubernetes security posture scanner with RBAC escalation-path analysis and linked Falco runtime detections"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
kubesentinel = "kubesentinel.cli:main"

[tool.setuptools.packages.find]
include = ["kubesentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
